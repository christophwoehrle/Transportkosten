      const eur = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
      const formatEuro = (v) => (v == null || Number.isNaN(v) ? "–" : eur.format(v));
      const formatDate = (iso) => {
        if (!iso) return "–";
        const d = new Date(iso);
        return Number.isNaN(d.getTime()) ? "–" : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });
      };
      const parseNumber = (value) => {
        const t = String(value).trim();
        if (t === "") return null;
        const n = Number(t.replace(/\./g, "").replace(",", "."));
        return Number.isNaN(n) ? null : n;

      const TAG_MS = 86400000;
      function berechneFrist(kaufdatum, jetzt = new Date()) {
        const start = kaufdatum ? new Date(kaufdatum) : null;
        if (!start || Number.isNaN(start.getTime()))
          return { ende: null, fortschritt: 0, tageVerbleibend: null, status: "unbekannt", labelVerbleibend: "Kein Kaufdatum" };
        const ende = new Date(start); ende.setFullYear(ende.getFullYear() + 10);
        const gesamt = ende - start, verstrichen = jetzt - start;
        const fortschritt = Math.max(0, Math.min(100, (verstrichen / gesamt) * 100));
        const tage = Math.ceil((ende - jetzt) / TAG_MS);
        let status, label;
        if (tage <= 0) { status = "gruen"; label = "Frist erreicht"; }
        else if (tage <= 365) { status = "gelb"; label = restlauf(tage); }
        else { status = "rot"; label = restlauf(tage); }
        return { ende, fortschritt, tageVerbleibend: tage, status, labelVerbleibend: label };
      }
      function restlauf(tage) {
        if (tage <= 0) return "Frist erreicht";
        const j = Math.floor(tage / 365), m = Math.floor((tage % 365) / 30);
        if (j > 0) return m > 0 ? `noch ${j} J. ${m} Mon.` : `noch ${j} Jahr${j === 1 ? "" : "e"}`;
        if (m > 0) return `noch ${m} Monat${m === 1 ? "" : "e"}`;
        return `noch ${tage} Tag${tage === 1 ? "" : "e"}`;
      }
      function monateImZeitraum(von, bis) {
        if (!von || !bis) return 12;
        const a = new Date(von), b = new Date(bis);
        if (Number.isNaN(a.getTime()) || Number.isNaN(b.getTime())) return 12;
        const m = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + 1;
        return m > 0 ? m : 12;
      }
      const normIban = (s) => s.replace(/\s+/g, "").toUpperCase();
      function isValidIban(input) {
        const iban = normIban(input);
        if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(iban)) return false;
        const re = iban.slice(4) + iban.slice(0, 4);
        const num = re.replace(/[A-Z]/g, (c) => (c.charCodeAt(0) - 55).toString());
        let rem = 0;
        for (let i = 0; i < num.length; i += 7) rem = Number(String(rem) + num.slice(i, i + 7)) % 97;
        return rem === 1;
      }

      // --- Mieteingang-Abgleich (Spiegel von lib/mieteingang.ts) ---
      function erwarteteMiete(w) {

      function passtZurMiete(w, t) {
        if (t.betrag <= 0) return false;
        const { kalt, warm } = erwarteteMiete(w);
        const betragOk = (warm > 0 && Math.abs(t.betrag - warm) <= 1) || (kalt > 0 && Math.abs(t.betrag - kalt) <= 1);

        const ibanOk = !!w.mieter.iban && !!t.iban && normIban(w.mieter.iban) === normIban(t.iban);

        return ibanOk || nameOk;

      function mieteingangJahr(w, transaktionen, jahr, jetzt = new Date()) {
        const { warm } = erwarteteMiete(w);
        const passende = transaktionen.filter((t) => passtZurMiete(w, t));
        const res = [];
        for (let m = 0; m < 12; m++) {
          const tx = passende.find((t) => { const d = new Date(t.datum); return d.getFullYear() === jahr && d.getMonth() === m; }) || null;
          const status = tx ? "bezahlt" : (new Date(jahr, m, 1) > jetzt ? "ausstehend" : "offen");

        return { aktuell: monate.filter((m) => m.status === "offen").length === 0,

      // --- Rentabilität (Spiegel von lib/rentabilitaet.ts) ---
      const TRANSAKTION_ART = { miete: "Mieteingang", sonstige_einnahme: "Sonstige Einnahme", hausverwaltung: "Hausverwaltung", grundsteuer: "Grundsteuer", sonstige_ausgabe: "Sonstige Ausgabe" };

      function rentabilitaet(w, transaktionen, jahr) {
        const zug = transaktionen.filter((t) => gehoertZuWohnung(w, t) && new Date(t.datum).getFullYear() === jahr);
        let einnahmen = 0, miete = 0, sonstigeEinnahme = 0;
        const aus = { hausverwaltung: 0, grundsteuer: 0, sonstige_ausgabe: 0 };
        const perMonat = Array.from({ length: 12 }, () => ({ einnahmen: 0, ausgaben: 0 }));
        for (const t of zug) {
          const m = new Date(t.datum).getMonth();
          if (t.betrag >= 0) { einnahmen += t.betrag; perMonat[m].einnahmen += t.betrag; if (t.art === "sonstige_einnahme") sonstigeEinnahme += t.betrag; else miete += t.betrag; }
          else { const a = Math.abs(t.betrag); perMonat[m].ausgaben += a; if (t.art === "hausverwaltung") aus.hausverwaltung += a; else if (t.art === "grundsteuer") aus.grundsteuer += a; else aus.sonstige_ausgabe += a; }
        }
        const ausgaben = aus.hausverwaltung + aus.grundsteuer + aus.sonstige_ausgabe;
        const saldo = einnahmen - ausgaben;
        return { jahr, einnahmen, miete, sonstigeEinnahme, ausgaben, ausgabenNachArt: aus, saldo, rendite: einnahmen > 0 ? saldo / einnahmen : null, perMonat, anzahl: zug.length };

      function abgangStatus(ist, erwartetProJahr, jahr, jetzt = new Date()) {

        let status;
        if (soll <= 0 || ist >= soll - 1) status = "aktuell"; else if (ist > 0) status = "teilweise"; else status = "offen";

      const MONATE_LANG = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
      function parseBetrag(s) {
        const t = String(s).trim().replace(/\s/g, "").replace(/€/g, "");
        if (!t) return null;
        const norm = t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t;
        const n = Number(norm);
        return Number.isNaN(n) ? null : n;
      }
      function splitCsvLine(line, delim) {
        const out = []; let cur = "", q = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; }
          else if (ch === delim && !q) { out.push(cur); cur = ""; }
          else cur += ch;
        }
        out.push(cur); return out.map((s) => s.trim());
      }
      function normDatum(s) {
        const t = String(s).trim();
        if (/^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0, 10);
        const m = t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})/);
        if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
        return t;
      }
      const bankService = {
        async getTransaktionen() { return (await db.transaktionen.toArray()).sort((a, b) => (a.datum < b.datum ? 1 : -1)); },
        async addTransaktion(t) { const n = Object.assign({}, t, { id: uid(), createdAt: Date.now() }); await db.transaktionen.put(n); return n; },
        async deleteTransaktion(id) { await db.transaktionen.delete(id); },
        async clearAll() { await db.transaktionen.clear(); },
        async importCsv(text) {
          const zeilen = text.split(/\r?\n/).map((z) => z.trim()).filter(Boolean);
          if (!zeilen.length) return 0;
          const delim = (zeilen[0].match(/;/g) || []).length >= (zeilen[0].match(/,/g) || []).length ? ";" : ",";
          const header = splitCsvLine(zeilen[0], delim).map((h) => h.toLowerCase());
          const idx = (ns) => header.findIndex((h) => ns.some((n) => h.includes(n)));
          const iDatum = idx(["datum", "date", "buchung"]), iBetrag = idx(["betrag", "amount", "umsatz"]);
          const iZweck = idx(["verwendung", "zweck", "purpose", "text"]), iName = idx(["gegen", "auftraggeber", "name", "empf", "beguen"]), iIban = idx(["iban", "konto"]);
          const hatHeader = iDatum >= 0 && iBetrag >= 0;
          const dz = hatHeader ? zeilen.slice(1) : zeilen;
          const neu = [];
          for (const z of dz) {
            const f = splitCsvLine(z, delim);
            const betrag = parseBetrag(hatHeader ? f[iBetrag] : f[1]);
            if (betrag == null) continue;
            neu.push({ id: uid(), datum: normDatum(hatHeader ? f[iDatum] : f[0]), betrag,
              verwendungszweck: (hatHeader ? f[iZweck] : f[2]) || "", gegenpartei: (hatHeader ? f[iName] : f[3]) || "",
              iban: (hatHeader ? f[iIban] : f[4]) || "", art: betrag >= 0 ? "miete" : "sonstige_ausgabe", quelle: "import", createdAt: Date.now() });
          }
          if (neu.length) await db.transaktionen.bulkAdd(neu);
          return neu.length;
        },
        async ladeDemodaten() {
          const wohnungen = await db.wohnungen.toArray();
          const jahr = new Date().getFullYear(), hm = new Date().getMonth(), neu = [];
          wohnungen.forEach((w, wi) => {
            const warm = (w.miete.kaltmiete || 0) + (w.miete.betriebskosten || 0);
            const kosten = erwarteteKosten(w);
            const auslassen = wi % 12;
            for (let m = 0; m <= hm; m++) {
              const mm = String(m + 1).padStart(2, "0");
              if (w.mieter.name && warm > 0 && m !== auslassen)
                neu.push({ id: uid(), datum: `${jahr}-${mm}-03`, betrag: warm, verwendungszweck: `Miete ${MONATE_LANG[m]} ${jahr}`,
                  gegenpartei: w.mieter.name, iban: w.mieter.iban || "", art: "miete", wohnungId: w.id, quelle: "demo", createdAt: Date.now() });
              if (kosten.hausverwaltungJahr && kosten.hausverwaltungJahr > 0)
                neu.push({ id: uid(), datum: `${jahr}-${mm}-28`, betrag: -Math.round((kosten.hausverwaltungJahr / 12) * 100) / 100,
                  verwendungszweck: `Hausverwaltung ${MONATE_LANG[m]} ${jahr}`, gegenpartei: "Hausverwaltung", iban: "", art: "hausverwaltung", wohnungId: w.id, quelle: "demo", createdAt: Date.now() });
            }
            if (kosten.grundsteuerJahr && kosten.grundsteuerJahr > 0) {
              const rate = Math.round((kosten.grundsteuerJahr / 4) * 100) / 100;
              [1, 4, 7, 10].forEach((mon) => { if (mon <= hm)
                neu.push({ id: uid(), datum: `${jahr}-${String(mon + 1).padStart(2, "0")}-15`, betrag: -rate,
                  verwendungszweck: `Grundsteuer Q${Math.floor(mon / 3) + 1} ${jahr}`, gegenpartei: "Finanzamt / Gemeinde", iban: "", art: "grundsteuer", wohnungId: w.id, quelle: "demo", createdAt: Date.now() }); });
            }
          });
          if (neu.length) await db.transaktionen.bulkAdd(neu);
          return neu.length;
        },
      };

      function NumberInput({ value, onValueChange, ...p }) {
        const [text, setText] = useState(value == null ? "" : String(value).replace(".", ","));
        useEffect(() => { if (parseNumber(text) !== value) setText(value == null ? "" : String(value).replace(".", ",")); }, [value]);
        return <Input inputMode="decimal" value={text} onChange={(e) => { setText(e.target.value); onValueChange(parseNumber(e.target.value)); }} {...p} />;
      }

      function Dialog({ open, onClose, title, description, children, footer }) {
        useEffect(() => {
          if (!open) return;
          const onKey = (e) => e.key === "Escape" && onClose();
          document.addEventListener("keydown", onKey);

        if (!open) return null;

      /* ------------------------------------------------------------------ */

      /* ------------------------------------------------------------------ */
      function DocumentSection({ wohnungId, kategorien, standardKategorie, titel, beschreibung, protokollId, kompakt }) {
        const [dokumente, setDokumente] = useState([]);
        const [kategorie, setKategorie] = useState(standardKategorie);
        const [previews, setPreviews] = useState({});
        const fileInput = useRef(null), cameraInput = useRef(null);

        const laden = useCallback(async () => {
          const alle = await repo.getDokumente(wohnungId);
          setDokumente(alle.filter((d) => kategorien.includes(d.kategorie) && (protokollId === undefined || d.protokollId === protokollId)));
        }, [wohnungId, protokollId]);
        useEffect(() => { laden(); }, [laden]);

        useEffect(() => {
          const urls = {};
          dokumente.forEach((d) => { if (d.mimeType.startsWith("image/")) urls[d.id] = URL.createObjectURL(d.blob); });
          setPreviews(urls);
          return () => Object.values(urls).forEach(URL.revokeObjectURL);
        }, [dokumente]);

        async function handleFiles(files) {
          if (!files || !files.length) return;
          for (const file of Array.from(files)) {
            await repo.saveDokument({ id: uid(), wohnungId, kategorie, protokollId, titel: file.name || "Unbenannt",
              datum: new Date().toISOString().slice(0, 10), mimeType: file.type || "application/octet-stream",
              size: file.size, blob: file, createdAt: Date.now() });
          }
          await laden();
          if (fileInput.current) fileInput.current.value = "";
          if (cameraInput.current) cameraInput.current.value = "";
        }
        function download(dok) {
          const url = URL.createObjectURL(dok.blob), a = document.createElement("a");
          a.href = url; a.download = dok.titel; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        }

        return <div className={kompakt ? "space-y-3" : "space-y-4"}>
          <div>
            <h3 className={kompakt ? "text-sm font-medium" : "text-base font-semibold"}>{titel}</h3>
            {beschreibung ? <p className="mt-1 text-sm text-muted-foreground">{beschreibung}</p> : null}
          </div>
          <div className="flex flex-wrap items-center gap-3">
            {kategorien.length > 1 ? (
              <Select value={kategorie} onChange={(e) => setKategorie(e.target.value)} className="w-auto">
                {kategorien.map((k) => <option key={k} value={k}>{DOK_KATEGORIEN[k]}</option>)}
              </Select>
            ) : null}
            <Button variant="outline" onClick={() => fileInput.current.click()}>⬆️ Datei hochladen</Button>
            <Button variant="outline" onClick={() => cameraInput.current.click()}>📷 Scannen</Button>
            <input ref={fileInput} type="file" accept="image/*,application/pdf" multiple className="hidden" onChange={(e) => handleFiles(e.target.files)} />
            <input ref={cameraInput} type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleFiles(e.target.files)} />
          </div>
          {dokumente.length === 0 ? (
            <p className="rounded-md border border-dashed border-border p-6 text-center text-sm text-muted-foreground">Noch keine Dokumente. Lade eine Datei hoch oder scanne sie mit der Kamera.</p>
          ) : (
            <div className="grid gap-3 sm:grid-cols-2">
              {dokumente.map((dok) => (
                <Card key={dok.id}><CardContent className="flex gap-3 p-3">
                  <div className="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-md bg-muted text-2xl">
                    {previews[dok.id] ? <img src={previews[dok.id]} alt={dok.titel} className="h-full w-full object-cover" /> : (dok.mimeType === "application/pdf" ? "📄" : "🖼️")}
                  </div>
                  <div className="min-w-0 flex-1">
                    <input value={dok.titel} onChange={async (e) => { await repo.saveDokument(Object.assign({}, dok, { titel: e.target.value })); laden(); }}
                      className="w-full truncate rounded border border-transparent bg-transparent text-sm font-medium hover:border-input focus:border-input focus:outline-none" />
                    <p className="mt-0.5 text-xs text-muted-foreground">{DOK_KATEGORIEN[dok.kategorie]} · {formatDate(dok.datum)}</p>
                    <p className="text-xs text-muted-foreground">{(dok.size / 1024).toFixed(0)} KB</p>
                    <div className="mt-2 flex gap-1">
                      <Button variant="ghost" size="sm" onClick={() => download(dok)}>⬇️ Download</Button>
                      <Button variant="ghost" size="sm" className="text-destructive hover:text-destructive" onClick={async () => { await repo.deleteDokument(dok.id); laden(); }}>🗑️ Löschen</Button>
                    </div>
                  </div>
                </CardContent></Card>
              ))}
            </div>
          )}
        </div>;
      }

            <Field label="Auszugsdatum (optional)"><Input type="date" value={m.auszugsdatum} onChange={(e) => setM({ auszugsdatum: e.target.value })} /></Field>
          </Grid></CardContent></Card>
          <Card><CardContent className="p-6"><DocumentSection wohnungId={w.id} kategorien={["mietvertrag"]} standardKategorie="mietvertrag" titel="Mietvertrag" beschreibung="Mietvertrag hochladen oder scannen." /></CardContent></Card>
        </div>;
      }

      function MieteTab({ w, update }) {
        const mi = w.miete;
        const setMi = (p) => update({ miete: Object.assign({}, mi, p) });
        const warm = (mi.kaltmiete || 0) + (mi.betriebskosten || 0);
        const Betrag = ({ label, value, betont }) => <div>
          <p className="text-xs text-muted-foreground">{label}</p>
          <p className={betont ? "text-xl font-semibold text-primary" : "text-lg font-medium"}>{formatEuro(value)}</p>
        </div>;
        return <div className="space-y-6">
          <Card><CardHeader><CardTitle>Monatliche Miete</CardTitle></CardHeader><CardContent className="space-y-6">
            <Grid>
              <Field label="Kaltmiete (€ / Monat)"><NumberInput value={mi.kaltmiete} onValueChange={(v) => setMi({ kaltmiete: v })} /></Field>
              <Field label="Betriebskostenvorauszahlung (€ / Monat)"><NumberInput value={mi.betriebskosten} onValueChange={(v) => setMi({ betriebskosten: v })} /></Field>
            </Grid>
            <div className="rounded-lg bg-muted p-5"><div className="grid gap-3 sm:grid-cols-3">
              <Betrag label="Kaltmiete" value={mi.kaltmiete} /><Betrag label="Nebenkosten (VZ)" value={mi.betriebskosten} /><Betrag label="Warmmiete" value={warm} betont />
            </div></div>
          </CardContent></Card>
          <Card><CardHeader><CardTitle>Jahresübersicht</CardTitle></CardHeader><CardContent><div className="grid gap-3 sm:grid-cols-3">
            <Betrag label="Kaltmiete / Jahr" value={(mi.kaltmiete || 0) * 12} /><Betrag label="Nebenkosten / Jahr" value={(mi.betriebskosten || 0) * 12} /><Betrag label="Warmmiete / Jahr" value={warm * 12} betont />
          </div></CardContent></Card>
        </div>;
      }

      function HausverwaltungTab({ w, update }) {
        const nk = w.nebenkosten;
        const setNk = (p) => update({ nebenkosten: Object.assign({}, nk, p) });
        const setPosten = (posten) => setNk({ posten });
        const upd = (id, p) => setPosten(nk.posten.map((x) => (x.id === id ? Object.assign({}, x, p) : x)));
        const summeUml = nk.posten.filter((p) => p.umlagefaehig).reduce((s, p) => s + (p.betrag || 0), 0);
        const summeGes = nk.posten.reduce((s, p) => s + (p.betrag || 0), 0);
        const monate = monateImZeitraum(nk.zeitraumVon, nk.zeitraumBis);
        const vz = (w.miete.betriebskosten || 0) * monate;
        const diff = summeUml - vz, nach = diff > 0;
        return <div className="space-y-6">
          <Card><CardContent className="p-6"><DocumentSection wohnungId={w.id} kategorien={["hausverwaltung", "sonstiges"]} standardKategorie="hausverwaltung" titel="Abrechnungen der Hausverwaltung" beschreibung="Abrechnungen hochladen oder scannen. Die einzelnen Kostenposten trägst du unten ein." /></CardContent></Card>
          <Card>
            <CardHeader className="flex-row items-center justify-between space-y-0"><CardTitle>Nebenkostenabrechnung</CardTitle><Button variant="outline" size="sm" onClick={() => window.print()}>🖨️ Als PDF / Drucken</Button></CardHeader>
            <CardContent className="space-y-5">
              <Grid>
                <Field label="Zeitraum von"><Input type="date" value={nk.zeitraumVon} onChange={(e) => setNk({ zeitraumVon: e.target.value })} /></Field>
                <Field label="Zeitraum bis" hint={`${monate} Monat(e) im Zeitraum`}><Input type="date" value={nk.zeitraumBis} onChange={(e) => setNk({ zeitraumBis: e.target.value })} /></Field>
              </Grid>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead><tr className="border-b">
                    <th className="h-10 px-3 text-left font-medium text-muted-foreground">Kostenposten</th>
                    <th className="h-10 px-3 text-left font-medium text-muted-foreground">Betrag</th>
                    <th className="h-10 px-3 text-center font-medium text-muted-foreground">Umlagefähig</th>
                    <th className="w-10" />
                  </tr></thead>
                  <tbody>
                    {nk.posten.length === 0 ? <tr><td colSpan={4} className="p-3 text-center text-muted-foreground">Noch keine Posten. Erfasse die Positionen aus der hochgeladenen Abrechnung.</td></tr> : null}
                    {nk.posten.map((p) => <tr key={p.id} className="border-b">
                      <td className="p-2"><Input value={p.bezeichnung} onChange={(e) => upd(p.id, { bezeichnung: e.target.value })} placeholder="z. B. Wasser/Abwasser" /></td>
                      <td className="p-2 w-40"><NumberInput value={p.betrag} onValueChange={(v) => upd(p.id, { betrag: v })} placeholder="0,00" /></td>
                      <td className="p-2 text-center"><div className="flex justify-center"><Checkbox checked={p.umlagefaehig} onCheckedChange={(c) => upd(p.id, { umlagefaehig: c })} /></div></td>
                      <td className="p-2"><Button variant="ghost" size="icon" className="text-muted-foreground hover:text-destructive" onClick={() => setPosten(nk.posten.filter((x) => x.id !== p.id))}>🗑️</Button></td>
                    </tr>)}
                  </tbody>
                </table>
              </div>
              <Button variant="outline" size="sm" onClick={() => setPosten([...nk.posten, { id: uid(), bezeichnung: "", betrag: null, umlagefaehig: true }])}>➕ Posten hinzufügen</Button>
              <div className="rounded-lg border border-border">
                <div className="flex items-center justify-between border-b border-border px-4 py-2.5 text-sm"><span className="text-muted-foreground">Umlagefähige Kosten</span><span className="font-medium">{formatEuro(summeUml)}</span></div>
                <div className="flex items-center justify-between border-b border-border px-4 py-2.5 text-sm"><span className="text-muted-foreground">Geleistete Vorauszahlung ({monate} × {formatEuro(w.miete.betriebskosten)})</span><span className="font-medium">− {formatEuro(vz)}</span></div>
                <div className={cx("flex items-center justify-between px-4 py-3 text-base font-semibold", nach ? "text-rose-700" : "text-emerald-700")}><span>{nach ? "Nachzahlung Mieter" : "Guthaben Mieter"}</span><span>{formatEuro(Math.abs(diff))}</span></div>
              </div>
              <p className="text-xs text-muted-foreground">Nicht umlagefähige Kosten (Summe aller Posten: {formatEuro(summeGes)}) fließen nicht in die Abrechnung ein.</p>
            </CardContent>
          </Card>
          <div className="print-only">
            <div style={{ fontFamily: "sans-serif", color: "#111", maxWidth: 720 }}>
              <h1 style={{ fontSize: 20, marginBottom: 4 }}>Nebenkostenabrechnung</h1>
              <p><strong>Objekt:</strong> {w.bezeichnung} — {[w.strasse, w.plz, w.ort].filter(Boolean).join(", ")}</p>
              <p><strong>Mieter:</strong> {w.mieter.name || "–"}</p>
              <p><strong>Zeitraum:</strong> {formatDate(nk.zeitraumVon)} – {formatDate(nk.zeitraumBis)} ({monate} Monate)</p>
              <table style={{ width: "100%", borderCollapse: "collapse", marginTop: 16 }}>
                <thead><tr>
                  <th style={{ borderBottom: "1px solid #999", textAlign: "left", padding: "6px 8px", fontSize: 13 }}>Kostenposten</th>
                  <th style={{ borderBottom: "1px solid #999", textAlign: "right", padding: "6px 8px", fontSize: 13 }}>Betrag</th>
                  <th style={{ borderBottom: "1px solid #999", textAlign: "center", padding: "6px 8px", fontSize: 13 }}>Umlagefähig</th>
                </tr></thead>
                <tbody>{nk.posten.map((p) => <tr key={p.id}>
                  <td style={{ borderBottom: "1px solid #ddd", padding: "6px 8px", fontSize: 13 }}>{p.bezeichnung || "–"}</td>
                  <td style={{ borderBottom: "1px solid #ddd", padding: "6px 8px", fontSize: 13, textAlign: "right" }}>{formatEuro(p.betrag)}</td>
                  <td style={{ borderBottom: "1px solid #ddd", padding: "6px 8px", fontSize: 13, textAlign: "center" }}>{p.umlagefaehig ? "ja" : "nein"}</td>
                </tr>)}</tbody>
              </table>
              <div style={{ marginTop: 16, fontSize: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0" }}><span>Umlagefähige Kosten</span><span>{formatEuro(summeUml)}</span></div>
                <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0" }}><span>Geleistete Vorauszahlung</span><span>− {formatEuro(vz)}</span></div>
                <div style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", fontWeight: 700, borderTop: "2px solid #111" }}><span>{nach ? "Nachzahlung Mieter" : "Guthaben Mieter"}</span><span>{formatEuro(Math.abs(diff))}</span></div>
              </div>
              <p style={{ marginTop: 24, fontSize: 11, color: "#666" }}>Erstellt am {formatDate(new Date().toISOString().slice(0, 10))}. Keine Steuerberatung.</p>
            </div>
          </div>
        </div>;
      }

      function FotosTab({ w }) {
        const [fotos, setFotos] = useState([]);
        const [urls, setUrls] = useState({});
        const [gross, setGross] = useState(null);
        const fileInput = useRef(null), cameraInput = useRef(null);
        const laden = useCallback(async () => setFotos(await repo.getDokumente(w.id, "foto")), [w.id]);
        useEffect(() => { laden(); }, [laden]);
        useEffect(() => {
          const map = {}; fotos.forEach((f) => (map[f.id] = URL.createObjectURL(f.blob)));
          setUrls(map); return () => Object.values(map).forEach(URL.revokeObjectURL);
        }, [fotos]);
        async function handleFiles(files) {
          if (!files) return;
          for (const file of Array.from(files)) {
            if (!file.type.startsWith("image/")) continue;
            await repo.saveDokument({ id: uid(), wohnungId: w.id, kategorie: "foto", titel: file.name || "Foto",
              datum: new Date().toISOString().slice(0, 10), mimeType: file.type, size: file.size, blob: file, createdAt: Date.now() });
          }
          await laden();
          if (fileInput.current) fileInput.current.value = "";
          if (cameraInput.current) cameraInput.current.value = "";
        }
        return <Card>
          <CardHeader className="flex-row items-center justify-between space-y-0"><CardTitle>Fotoalbum</CardTitle>
            <div className="flex gap-2"><Button variant="outline" size="sm" onClick={() => fileInput.current.click()}>⬆️ Hochladen</Button><Button variant="outline" size="sm" onClick={() => cameraInput.current.click()}>📷 Aufnehmen</Button></div>
          </CardHeader>
          <CardContent>
            <input ref={fileInput} type="file" accept="image/*" multiple className="hidden" onChange={(e) => handleFiles(e.target.files)} />
            <input ref={cameraInput} type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handleFiles(e.target.files)} />
            {fotos.length === 0
              ? <p className="rounded-md border border-dashed border-border p-8 text-center text-sm text-muted-foreground">Noch keine Fotos. Lade Grundfotos hoch oder nimm sie mit der Kamera auf.</p>
              : <div className="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4">
                  {fotos.map((f) => <div key={f.id} className="group relative aspect-square overflow-hidden rounded-lg border border-border bg-muted">
                    <img src={urls[f.id]} alt={f.titel} className="h-full w-full cursor-zoom-in object-cover" onClick={() => setGross(urls[f.id])} />
                    <button onClick={async () => { await repo.deleteDokument(f.id); laden(); }} className="absolute right-1.5 top-1.5 flex h-7 w-7 items-center justify-center rounded-md bg-black/50 text-white opacity-0 transition-opacity hover:bg-destructive group-hover:opacity-100">🗑️</button>
                  </div>)}
                </div>}
            {gross ? <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 p-4" onClick={() => setGross(null)}><img src={gross} alt="Vorschau" className="max-h-full max-w-full rounded-lg" /></div> : null}
          </CardContent>
        </Card>;
      }

      function ProtokollTab({ w, update }) {
        const eintraege = w.protokoll;
        const setE = (next) => update({ protokoll: next });
        const upd = (id, p) => setE(eintraege.map((e) => (e.id === id ? Object.assign({}, e, p) : e)));
        const add = () => setE([{ id: uid(), typ: "reparatur", datum: new Date().toISOString().slice(0, 10), beschreibung: "",
          kontaktName: "", kontaktEmail: "", kontaktTelefon: "", behoben: false, mietminderung: { aktiv: false, von: "", bis: "", betrag: null }, createdAt: Date.now() }, ...eintraege]);
        async function remove(id) {
          const belege = await repo.getDokumente(w.id, "beleg");
          await Promise.all(belege.filter((d) => d.protokollId === id).map((d) => repo.deleteDokument(d.id)));
          setE(eintraege.filter((e) => e.id !== id));
        }
        return <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div><h2 className="text-lg font-semibold">Protokoll</h2><p className="text-sm text-muted-foreground">Reparaturen, Wartungen und Schäden dokumentieren – inkl. Belegen und eventueller Mietminderung.</p></div>
            <Button onClick={add}>➕ Neuer Eintrag</Button>
          </div>
          {eintraege.length === 0
            ? <Card><CardContent className="flex flex-col items-center gap-3 py-12 text-center"><div className="text-4xl">🔧</div><p className="text-sm text-muted-foreground">Noch keine Einträge. Lege z. B. eine Reparatur an.</p><Button onClick={add}>➕ Neuer Eintrag</Button></CardContent></Card>
            : eintraege.map((e) => <Card key={e.id}>
                <CardHeader className="flex-row items-start justify-between space-y-0">
                  <div className="flex items-center gap-2">
                    <CardTitle className="text-base">{PROTOKOLL_TYPEN[e.typ]}</CardTitle>
                    <Badge variant={e.behoben ? "success" : "warning"}>{e.behoben ? "behoben" : "offen"}</Badge>
                    {e.mietminderung.aktiv ? <Badge variant="danger">Mietminderung</Badge> : null}
                  </div>
                  <Button variant="ghost" size="icon" className="text-muted-foreground hover:text-destructive" onClick={() => remove(e.id)}>🗑️</Button>
                </CardHeader>
                <CardContent className="space-y-4">
                  <Grid>
                    <Field label="Art"><Select value={e.typ} onChange={(ev) => upd(e.id, { typ: ev.target.value })}>{Object.keys(PROTOKOLL_TYPEN).map((t) => <option key={t} value={t}>{PROTOKOLL_TYPEN[t]}</option>)}</Select></Field>
                    <Field label="Wann"><Input type="date" value={e.datum} onChange={(ev) => upd(e.id, { datum: ev.target.value })} /></Field>
                  </Grid>
                  <Field label="Beschreibung"><Textarea value={e.beschreibung} onChange={(ev) => upd(e.id, { beschreibung: ev.target.value })} placeholder="z. B. Wespennest am Balkon muss entfernt werden." /></Field>
                  <div>
                    <p className="mb-2 text-sm font-medium">Durch wen (Kontakt)</p>
                    <Grid>
                      <Field label="Name"><Input value={e.kontaktName} onChange={(ev) => upd(e.id, { kontaktName: ev.target.value })} /></Field>
                      <Field label="Telefon"><Input type="tel" value={e.kontaktTelefon} onChange={(ev) => upd(e.id, { kontaktTelefon: ev.target.value })} /></Field>
                    </Grid>
                    <div className="mt-4"><Field label="E-Mail"><Input type="email" value={e.kontaktEmail} onChange={(ev) => upd(e.id, { kontaktEmail: ev.target.value })} /></Field></div>
                  </div>
                  <div className="rounded-lg border border-border p-4">
                    <DocumentSection wohnungId={w.id} protokollId={e.id} kategorien={["beleg"]} standardKategorie="beleg" titel="Belege" beschreibung="Rechnung/Beleg hochladen oder scannen." kompakt />
                  </div>
                  <div className="flex flex-wrap items-center gap-6 border-t border-border pt-4">
                    <label className="flex cursor-pointer items-center gap-2 text-sm font-medium"><Checkbox checked={e.behoben} onCheckedChange={(c) => upd(e.id, { behoben: c })} />Problem behoben</label>
                    <label className="flex cursor-pointer items-center gap-2 text-sm font-medium"><Checkbox checked={e.mietminderung.aktiv} onCheckedChange={(c) => upd(e.id, { mietminderung: Object.assign({}, e.mietminderung, { aktiv: c }) })} />Mietminderung</label>
                  </div>
                  {e.mietminderung.aktiv ? <div className="rounded-lg bg-muted p-4">
                    <Grid>
                      <Field label="Von"><Input type="date" value={e.mietminderung.von} onChange={(ev) => upd(e.id, { mietminderung: Object.assign({}, e.mietminderung, { von: ev.target.value }) })} /></Field>
                      <Field label="Bis"><Input type="date" value={e.mietminderung.bis} onChange={(ev) => upd(e.id, { mietminderung: Object.assign({}, e.mietminderung, { bis: ev.target.value }) })} /></Field>
                    </Grid>
                    <div className="mt-4"><Field label="Geminderte Miete (€ / Monat)" hint={w.miete.kaltmiete != null ? "Reguläre Kaltmiete: " + formatEuro(w.miete.kaltmiete) : undefined}><NumberInput value={e.mietminderung.betrag} onValueChange={(v) => upd(e.id, { mietminderung: Object.assign({}, e.mietminderung, { betrag: v }) })} /></Field></div>
                    <p className="mt-3 text-xs text-muted-foreground">Mietminderung {formatDate(e.mietminderung.von)} – {formatDate(e.mietminderung.bis)} auf {formatEuro(e.mietminderung.betrag)} / Monat.</p>
                  </div> : null}
                </CardContent>
              </Card>)}
        </div>;
      }

      function MieteingangTab({ w }) {
        const [transaktionen, setTransaktionen] = useState([]);
        const [jahr, setJahr] = useState(new Date().getFullYear());
        const [importOffen, setImportOffen] = useState(false);
        const [csv, setCsv] = useState("");
        const [neu, setNeu] = useState({ datum: "", betrag: "", zweck: "" });
        const [meldung, setMeldung] = useState(null);
        const fileInput = useRef(null);
        const laden = useCallback(async () => setTransaktionen(await bankService.getTransaktionen()), []);
        useEffect(() => { laden(); }, [laden]);
        const monate = useMemo(() => mieteingangJahr(w, transaktionen, jahr), [w, transaktionen, jahr]);
        const warm = erwarteteMiete(w).warm;
        const bezahlt = monate.filter((m) => m.status === "bezahlt").length;
        const offen = monate.filter((m) => m.status === "offen").length;
        const SB = { bezahlt: ["success", "bezahlt"], offen: ["danger", "offen"], ausstehend: ["secondary", "ausstehend"] };
        const zugeordnet = useMemo(() => { const ids = new Set(monate.map((m) => m.transaktion && m.transaktion.id).filter(Boolean)); return transaktionen.filter((t) => ids.has(t.id)); }, [monate, transaktionen]);
        async function demodaten() { const n = await bankService.ladeDemodaten(); await laden(); setMeldung(n + " Demo-Buchungen geladen."); }
        async function importieren() { const n = await bankService.importCsv(csv); await laden(); setImportOffen(false); setCsv(""); setMeldung(n + " Buchungen importiert."); }
        async function datei(files) { if (!files || !files[0]) return; const n = await bankService.importCsv(await files[0].text()); await laden(); setMeldung(n + " Buchungen aus Datei importiert."); if (fileInput.current) fileInput.current.value = ""; }
        async function manuell() { const b = parseNumber(neu.betrag); if (b == null || !neu.datum) return; await bankService.addTransaktion({ datum: neu.datum, betrag: b, verwendungszweck: neu.zweck, gegenpartei: w.mieter.name, iban: w.mieter.iban, art: "miete", wohnungId: w.id, quelle: "manuell" }); setNeu({ datum: "", betrag: "", zweck: "" }); await laden(); }
        return <div className="space-y-6">
          <Card>
            <CardHeader className="flex-row items-center justify-between space-y-0">
              <CardTitle>💶 Mieteingang prüfen</CardTitle>
              <div className="flex items-center gap-2"><Button variant="ghost" size="icon" onClick={() => setJahr((j) => j - 1)}>‹</Button><span className="w-14 text-center text-sm font-medium">{jahr}</span><Button variant="ghost" size="icon" onClick={() => setJahr((j) => j + 1)}>›</Button></div>
            </CardHeader>
            <CardContent className="space-y-4">
              <div className="flex flex-wrap gap-3 text-sm"><span className="text-muted-foreground">Erwartete Warmmiete: <b className="text-foreground">{formatEuro(warm)}</b> / Monat</span><span className="text-muted-foreground">·</span><span className="text-emerald-700">{bezahlt} bezahlt</span><span className="text-rose-700">{offen} offen</span></div>
              {warm <= 0 ? <p className="rounded-md bg-amber-50 p-3 text-xs text-amber-800">Keine Kaltmiete hinterlegt – der Abgleich benötigt die Miete aus dem Reiter „Miete & Nebenkosten".</p> : null}
              <div className="grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-4">
                {monate.map((m) => <div key={m.monat} className="rounded-lg border border-border p-3">
                  <div className="flex items-center justify-between"><span className="text-sm font-medium">{MONATE_KURZ[m.monat]}</span><Badge variant={SB[m.status][0]}>{SB[m.status][1]}</Badge></div>
                  <p className="mt-1 text-xs text-muted-foreground">Soll: {formatEuro(m.soll)}</p>
                  <p className="text-xs text-muted-foreground">{m.transaktion ? "Ist: " + formatEuro(m.transaktion.betrag) + " · " + formatDate(m.transaktion.datum) : (m.status === "ausstehend" ? "noch nicht fällig" : "kein Eingang")}</p>
                </div>)}
              </div>
            </CardContent>
          </Card>
          <Card>
            <CardHeader><CardTitle className="text-base">Banking-Schnittstelle</CardTitle></CardHeader>
            <CardContent className="space-y-4">
              <p className="text-sm text-muted-foreground">Kontobewegungen werden lokal gehalten und gegen die erwartete Miete abgeglichen. Import als CSV, aus Datei oder manuell; eine echte Bank-Anbindung (FinTS/HBCI oder Banking-API) lässt sich über die <code className="mx-1 rounded bg-muted px-1">BankService</code>-Schnittstelle ergänzen.</p>
              {meldung ? <p className="flex items-center gap-2 rounded-md bg-emerald-50 p-2 text-xs text-emerald-800">✓ {meldung}</p> : null}
              <div className="flex flex-wrap gap-2">
                <Button variant="outline" size="sm" onClick={demodaten}>🔄 Demodaten laden</Button>
                <Button variant="outline" size="sm" onClick={() => setImportOffen((v) => !v)}>⬆️ CSV einfügen</Button>
                <Button variant="outline" size="sm" onClick={() => fileInput.current.click()}>⬆️ CSV-Datei</Button>
                <input ref={fileInput} type="file" accept=".csv,text/csv,text/plain" className="hidden" onChange={(e) => datei(e.target.files)} />
                {transaktionen.length > 0 ? <Button variant="ghost" size="sm" className="text-destructive hover:text-destructive" onClick={async () => { await bankService.clearAll(); await laden(); }}>🗑️ Alle löschen</Button> : null}
              </div>
              {importOffen ? <div className="space-y-2">
                <textarea value={csv} onChange={(e) => setCsv(e.target.value)} placeholder={"Datum;Betrag;Verwendungszweck;Gegenpartei;IBAN\n03.01.2026;1400,00;Miete Januar;Julia Sommer;DE89370400440532013000"} className="h-28 w-full rounded-md border border-input bg-background p-2 font-mono text-xs" />
                <div className="flex gap-2"><Button size="sm" onClick={importieren} disabled={!csv.trim()}>Importieren</Button><Button size="sm" variant="ghost" onClick={() => setImportOffen(false)}>✕ Abbrechen</Button></div>
              </div> : null}
              <div className="rounded-lg border border-dashed border-border p-4">
                <p className="mb-3 text-sm font-medium">Buchung manuell erfassen</p>
                <Grid>
                  <Field label="Datum"><Input type="date" value={neu.datum} onChange={(e) => setNeu(Object.assign({}, neu, { datum: e.target.value }))} /></Field>
                  <Field label="Betrag (€)"><NumberInput value={parseNumber(neu.betrag)} onValueChange={(v) => setNeu(Object.assign({}, neu, { betrag: v == null ? "" : String(v).replace(".", ",") }))} /></Field>
                </Grid>
                <div className="mt-4"><Field label="Verwendungszweck"><Input value={neu.zweck} onChange={(e) => setNeu(Object.assign({}, neu, { zweck: e.target.value }))} placeholder="z. B. Miete" /></Field></div>
                <Button size="sm" className="mt-3" onClick={manuell} disabled={!neu.datum || parseNumber(neu.betrag) == null}>➕ Hinzufügen (Mieter {w.mieter.name || "?"})</Button>
              </div>
              {zugeordnet.length > 0 ? <div>
                <p className="mb-2 text-sm font-medium">Zugeordnete Eingänge {jahr} ({zugeordnet.length})</p>
                <div className="divide-y divide-border rounded-lg border border-border">
                  {zugeordnet.map((t) => <div key={t.id} className="flex items-center justify-between p-2.5 text-sm">
                    <div><p className="font-medium">{formatEuro(t.betrag)}</p><p className="text-xs text-muted-foreground">{formatDate(t.datum)} · {t.verwendungszweck || t.gegenpartei || "–"}{t.quelle === "demo" ? " · Demo" : ""}</p></div>
                    <Button variant="ghost" size="icon" className="text-muted-foreground hover:text-destructive" onClick={async () => { await bankService.deleteTransaktion(t.id); laden(); }}>🗑️</Button>
                  </div>)}
                </div>
              </div> : null}
            </CardContent>
          </Card>
        </div>;
      }

      const RENTA_STATUS = { aktuell: ["success", "aktuell"], teilweise: ["warning", "teilweise"], offen: ["danger", "offen"], unbekannt: ["secondary", "kein Sollwert"] };
      function Legende({ farbe, text }) { return <span className="inline-flex items-center gap-1.5"><span className={"inline-block h-2.5 w-2.5 rounded-sm " + farbe} />{text}</span>; }
      function CashflowChart({ perMonat }) {
        const W = 720, H = 200, padL = 44, padR = 8, padT = 10, padB = 22;
        const innerW = W - padL - padR, innerH = H - padT - padB;
        const max = Math.max(1, ...perMonat.map((m) => Math.max(m.einnahmen, m.ausgaben)));
        const groupW = innerW / 12, barW = Math.min(10, groupW / 2 - 2);
        const y = (v) => padT + innerH - (v / max) * innerH;
        return <div className="w-full overflow-x-auto"><svg viewBox={`0 0 ${W} ${H}`} className="h-52 w-full min-w-[520px]" role="img" aria-label="Monatlicher Cashflow">
          {[0, max / 2, max].map((gv, i) => <g key={i}>
            <line x1={padL} x2={W - padR} y1={y(gv)} y2={y(gv)} stroke="currentColor" className="text-border" strokeWidth={1} />
            <text x={padL - 6} y={y(gv) + 3} textAnchor="end" className="fill-muted-foreground" fontSize={9}>{Math.round(gv)}</text>
          </g>)}
          {perMonat.map((m, i) => { const gx = padL + i * groupW + groupW / 2; return <g key={i}>
            <rect x={gx - barW - 1} y={y(m.einnahmen)} width={barW} height={padT + innerH - y(m.einnahmen)} className="fill-emerald-500" rx={1}><title>{MONATE_KURZ[i] + ": Einnahmen " + formatEuro(m.einnahmen)}</title></rect>
            <rect x={gx + 1} y={y(m.ausgaben)} width={barW} height={padT + innerH - y(m.ausgaben)} className="fill-rose-500" rx={1}><title>{MONATE_KURZ[i] + ": Ausgaben " + formatEuro(m.ausgaben)}</title></rect>
            <text x={gx} y={H - 6} textAnchor="middle" className="fill-muted-foreground" fontSize={9}>{MONATE_KURZ[i]}</text>
          </g>; })}
        </svg></div>;
      }
      function RentabilitaetTab({ w }) {
        const [transaktionen, setTransaktionen] = useState([]);
        const [jahr, setJahr] = useState(new Date().getFullYear());
        const [neu, setNeu] = useState({ art: "hausverwaltung", datum: "", betrag: "", zweck: "" });
        const laden = useCallback(async () => setTransaktionen(await bankService.getTransaktionen()), []);
        useEffect(() => { laden(); }, [laden]);
        const r = useMemo(() => rentabilitaet(w, transaktionen, jahr), [w, transaktionen, jahr]);
        const kosten = erwarteteKosten(w);
        const hv = abgangStatus(r.ausgabenNachArt.hausverwaltung, kosten.hausverwaltungJahr, jahr);
        const gs = abgangStatus(r.ausgabenNachArt.grundsteuer, kosten.grundsteuerJahr, jahr);
        const eigene = useMemo(() => transaktionen.filter((t) => gehoertZuWohnung(w, t) && new Date(t.datum).getFullYear() === jahr).sort((a, b) => (a.datum < b.datum ? 1 : -1)), [transaktionen, w, jahr]);
        const ausMax = Math.max(r.einnahmen, r.ausgaben, 1);
        async function buchen() { const b = parseNumber(neu.betrag); if (b == null || !neu.datum) return; const s = istEinnahme(neu.art) ? Math.abs(b) : -Math.abs(b);
          await bankService.addTransaktion({ datum: neu.datum, betrag: s, verwendungszweck: neu.zweck || TRANSAKTION_ART[neu.art], gegenpartei: istEinnahme(neu.art) ? w.mieter.name : TRANSAKTION_ART[neu.art], iban: neu.art === "miete" ? w.mieter.iban : "", art: neu.art, wohnungId: w.id, quelle: "manuell" });
          setNeu(Object.assign({}, neu, { datum: "", betrag: "", zweck: "" })); await laden(); }
        const Kpi = ({ label, value, tone, betont, rendite }) => <div className={"rounded-lg border border-border p-4 " + (betont ? "bg-muted" : "")}>
          <div className="flex items-center gap-1.5 text-sm text-muted-foreground"><span>{tone === "pos" ? "📈" : "📉"}</span>{label}</div>
          <p className={"mt-1 text-2xl font-semibold " + (betont ? (tone === "pos" ? "text-emerald-700" : "text-rose-700") : "text-foreground")}>{value}</p>
          {rendite != null ? <p className="text-xs text-muted-foreground">Rendite (Saldo/Einnahmen): {(rendite * 100).toFixed(0)} %</p> : null}
        </div>;
        const Abgang = ({ titel, ist, st, erwartetJahr }) => <div className="rounded-lg border border-border p-4">
          <div className="flex items-center justify-between"><p className="text-sm font-medium">{titel}</p><Badge variant={RENTA_STATUS[st.status][0]}>{RENTA_STATUS[st.status][1]}</Badge></div>
          <p className="mt-2 text-lg font-semibold">{formatEuro(ist)}</p>
          <p className="text-xs text-muted-foreground">{erwartetJahr != null ? "Soll bis heute: " + formatEuro(st.soll) + " · erwartet/Jahr: " + formatEuro(erwartetJahr) : "Kein Sollwert (NK-Posten fehlt)"}</p>
        </div>;
        const seg = (v, total, cls, title) => (v > 0 && total > 0) ? <div className={"h-full " + cls} style={{ width: (v / total) * 100 + "%" }} title={title + ": " + formatEuro(v)} /> : null;
        return <div className="space-y-6">
          <Card>
            <CardHeader className="flex-row items-center justify-between space-y-0"><CardTitle>Rentabilität – Einnahmen / Ausgaben</CardTitle>
              <div className="flex items-center gap-2"><Button variant="ghost" size="icon" onClick={() => setJahr((j) => j - 1)}>‹</Button><span className="w-14 text-center text-sm font-medium">{jahr}</span><Button variant="ghost" size="icon" onClick={() => setJahr((j) => j + 1)}>›</Button></div>
            </CardHeader>
            <CardContent className="space-y-6">
              <div className="grid gap-3 sm:grid-cols-3">
                <Kpi label="Einnahmen" value={formatEuro(r.einnahmen)} tone="pos" />
                <Kpi label="Ausgaben" value={formatEuro(r.ausgaben)} tone="neg" />
                <Kpi label="Saldo (Cashflow)" value={formatEuro(r.saldo)} tone={r.saldo >= 0 ? "pos" : "neg"} betont rendite={r.rendite} />
              </div>
              {r.anzahl === 0 ? <p className="rounded-md bg-amber-50 p-3 text-xs text-amber-800">Für {jahr} sind keine Kontobewegungen zugeordnet. Buchungen unten erfassen oder im Reiter „Mieteingang" Demodaten laden.</p> : null}
              <div className="space-y-3">
                <div>
                  <div className="mb-1 flex justify-between text-xs"><span className="text-muted-foreground">Einnahmen</span><span className="font-medium">{formatEuro(r.einnahmen)}</span></div>
                  <div className="h-6 w-full overflow-hidden rounded-md bg-muted"><div className="h-full rounded-md bg-emerald-500" style={{ width: (r.einnahmen / ausMax) * 100 + "%" }} /></div>
                </div>
                <div>
                  <div className="mb-1 flex justify-between text-xs"><span className="text-muted-foreground">Ausgaben</span><span className="font-medium">{formatEuro(r.ausgaben)}</span></div>
                  <div className="flex h-6 overflow-hidden rounded-md bg-muted" style={{ width: (r.ausgaben / ausMax) * 100 + "%" }}>
                    {seg(r.ausgabenNachArt.hausverwaltung, r.ausgaben, "bg-rose-500", "Hausverwaltung")}
                    {seg(r.ausgabenNachArt.grundsteuer, r.ausgaben, "bg-amber-500", "Grundsteuer")}
                    {seg(r.ausgabenNachArt.sonstige_ausgabe, r.ausgaben, "bg-slate-400", "Sonstige")}
                  </div>
                  <div className="mt-1.5 flex flex-wrap gap-3 text-xs text-muted-foreground">
                    <Legende farbe="bg-rose-500" text={"Hausverwaltung " + formatEuro(r.ausgabenNachArt.hausverwaltung)} />
                    <Legende farbe="bg-amber-500" text={"Grundsteuer " + formatEuro(r.ausgabenNachArt.grundsteuer)} />
                    {r.ausgabenNachArt.sonstige_ausgabe > 0 ? <Legende farbe="bg-slate-400" text={"Sonstige " + formatEuro(r.ausgabenNachArt.sonstige_ausgabe)} /> : null}
                  </div>
                </div>
              </div>
              <div>
                <p className="mb-2 text-sm font-medium">Monatlicher Cashflow {jahr}</p>
                <CashflowChart perMonat={r.perMonat} />
                <div className="mt-2 flex flex-wrap gap-4 text-xs text-muted-foreground"><Legende farbe="bg-emerald-500" text="Einnahmen" /><Legende farbe="bg-rose-500" text="Ausgaben" /></div>
              </div>
              <div className="grid gap-3 sm:grid-cols-2">
                <Abgang titel="Hausverwaltung" ist={r.ausgabenNachArt.hausverwaltung} st={hv} erwartetJahr={kosten.hausverwaltungJahr} />
                <Abgang titel="Grundsteuer" ist={r.ausgabenNachArt.grundsteuer} st={gs} erwartetJahr={kosten.grundsteuerJahr} />
              </div>
            </CardContent>
          </Card>
          <Card>
            <CardHeader><CardTitle className="text-base">Buchung erfassen</CardTitle></CardHeader>
            <CardContent className="space-y-4">
              <Grid>
                <Field label="Art"><Select value={neu.art} onChange={(e) => setNeu(Object.assign({}, neu, { art: e.target.value }))}>{Object.keys(TRANSAKTION_ART).map((a) => <option key={a} value={a}>{TRANSAKTION_ART[a]} {istEinnahme(a) ? "(Einnahme)" : "(Ausgabe)"}</option>)}</Select></Field>
                <Field label="Datum"><Input type="date" value={neu.datum} onChange={(e) => setNeu(Object.assign({}, neu, { datum: e.target.value }))} /></Field>
                <Field label="Betrag (€)" hint="Vorzeichen wird aus der Art abgeleitet."><NumberInput value={parseNumber(neu.betrag)} onValueChange={(v) => setNeu(Object.assign({}, neu, { betrag: v == null ? "" : String(v).replace(".", ",") }))} /></Field>
                <Field label="Verwendungszweck"><Input value={neu.zweck} onChange={(e) => setNeu(Object.assign({}, neu, { zweck: e.target.value }))} /></Field>
              </Grid>
              <Button size="sm" onClick={buchen} disabled={!neu.datum || parseNumber(neu.betrag) == null}>➕ Buchung hinzufügen</Button>
              {eigene.length > 0 ? <div>
                <p className="mb-2 text-sm font-medium">Buchungen {jahr} ({eigene.length})</p>
                <div className="divide-y divide-border rounded-lg border border-border">
                  {eigene.map((t) => <div key={t.id} className="flex items-center justify-between gap-2 p-2.5 text-sm">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2"><span className={t.betrag >= 0 ? "font-medium text-emerald-700" : "font-medium text-rose-700"}>{t.betrag >= 0 ? "+" : "−"}{formatEuro(Math.abs(t.betrag))}</span><Badge variant="secondary">{TRANSAKTION_ART[t.art]}</Badge></div>
                      <p className="truncate text-xs text-muted-foreground">{new Date(t.datum).toLocaleDateString("de-DE")} · {t.verwendungszweck || t.gegenpartei || "–"}{t.quelle === "demo" ? " · Demo" : ""}</p>
                    </div>
                    <Button variant="ghost" size="icon" className="shrink-0 text-muted-foreground hover:text-destructive" onClick={async () => { await bankService.deleteTransaktion(t.id); laden(); }}>🗑️</Button>
                  </div>)}
                </div>
              </div> : null}
            </CardContent>
          </Card>
        </div>;
      }

      /* ------------------------------------------------------------------ */
      /*  Seiten                                                             */
      /* ------------------------------------------------------------------ */
      const TABS = [
        { key: "grunddaten", label: "Grunddaten", icon: "🏠", C: GrunddatenTab },
        { key: "fotos", label: "Fotos", icon: "🖼️", C: FotosTab },
        { key: "finanzierung", label: "Finanzierung", icon: "💶", C: FinanzierungTab },
        { key: "grundbuch", label: "Grundbuch & Notar", icon: "🏛️", C: null },
        { key: "mieter", label: "Mieter", icon: "👥", C: MieterTab },
        { key: "miete", label: "Miete & Nebenkosten", icon: "🧾", C: MieteTab },
        { key: "mieteingang", label: "Mieteingang", icon: "🏦", C: MieteingangTab },
        { key: "rentabilitaet", label: "Rentabilität", icon: "📈", C: RentabilitaetTab },
        { key: "hausverwaltung", label: "Hausverwaltung & NK", icon: "📄", C: HausverwaltungTab },
        { key: "protokoll", label: "Protokoll", icon: "📋", C: ProtokollTab },
      ];

      function WohnungDetail({ id, onBack }) {
        const [w, setW] = useState(null);
        const [tab, setTab] = useState("grunddaten");
        const [gespeichert, setGespeichert] = useState(true);
        const timer = useRef(null);
        useEffect(() => { repo.getWohnung(id).then((x) => x ? setW(x) : onBack()); }, [id]);
        const update = useCallback((patch) => { setW((prev) => prev ? Object.assign({}, prev, patch) : prev); setGespeichert(false); }, []);
        useEffect(() => {
          if (!w || gespeichert) return;
          if (timer.current) clearTimeout(timer.current);
          timer.current = setTimeout(async () => { await repo.saveWohnung(w); setGespeichert(true); }, 400);
          return () => timer.current && clearTimeout(timer.current);
        }, [w, gespeichert]);
        if (!w) return <p className="text-sm text-muted-foreground">Lädt …</p>;
        return <div className="space-y-6">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <button onClick={onBack} className="flex h-9 w-9 items-center justify-center rounded-md border border-border text-muted-foreground hover:bg-accent">←</button>
              <div>
                <h1 className="text-xl font-semibold tracking-tight">{w.bezeichnung || "Ohne Namen"}</h1>
                <p className="text-xs text-muted-foreground">{[w.strasse, w.plz, w.ort].filter(Boolean).join(", ") || "Keine Adresse"}</p>
              </div>
            </div>
            <span className="text-xs text-muted-foreground">{gespeichert ? "✓ Gespeichert" : "Speichert …"}</span>
          </div>
          <div className="no-print inline-flex flex-wrap items-center gap-1 rounded-lg bg-muted p-1">
            {TABS.map((t) => <button key={t.key} onClick={() => setTab(t.key)} className={cx("inline-flex items-center gap-1.5 rounded-md px-3 py-1.5 text-sm font-medium transition-all", tab === t.key ? "bg-background text-foreground shadow-sm" : "text-muted-foreground hover:text-foreground")}><span>{t.icon}</span><span className="hidden sm:inline">{t.label}</span></button>)}
          </div>
          <div>
            {tab === "grundbuch"
              ? <Card><CardContent className="p-6"><DocumentSection wohnungId={w.id} kategorien={["notarvertrag", "grundbuch", "sonstiges"]} standardKategorie="notarvertrag" titel="Grundbuch & Notar" beschreibung="Notarverträge, Grundbuchauszüge und weitere Unterlagen hochladen oder scannen." /></CardContent></Card>
              : (() => { const T = TABS.find((t) => t.key === tab).C; return <T w={w} update={update} />; })()}
          </div>
        </div>;
      }

      function FinanzZeile({ w, transaktionen, jahr, onOpen }) {
        const miete = mieteStatusKompakt(w, transaktionen, jahr);
        const r = rentabilitaet(w, transaktionen, jahr);
        const kosten = erwarteteKosten(w);
        const hv = abgangStatus(r.ausgabenNachArt.hausverwaltung, kosten.hausverwaltungJahr, jahr);
        const gs = abgangStatus(r.ausgabenNachArt.grundsteuer, kosten.grundsteuerJahr, jahr);
        const mieteBadge = !miete.hatMiete ? ["secondary", "keine Miete"] : (miete.aktuell ? ["success", "aktuell"] : ["danger", miete.offen + " offen"]);
        const chip = (icon, label, b) => <div className="flex items-center gap-1.5"><span>{icon}</span><span className="text-muted-foreground">{label}:</span><Badge variant={b[0]}>{b[1]}</Badge></div>;
        const max = Math.max(r.einnahmen, r.ausgaben, 1);
        return <button onClick={() => onOpen(w.id)} className="block w-full rounded-lg border border-border p-4 text-left transition-colors hover:bg-accent/50">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div className="min-w-0"><p className="font-medium">{w.bezeichnung || "Ohne Namen"}</p><p className="text-xs text-muted-foreground">{w.ort || "–"}</p></div>
            <div className="flex flex-wrap items-center gap-x-4 gap-y-2 text-xs">
              {chip("💶", "Miete", mieteBadge)}
              {chip("🏢", "Hausverwaltung", RENTA_STATUS[hv.status])}
              {chip("🏛️", "Grundsteuer", RENTA_STATUS[gs.status])}
              <div className="text-right"><p className="text-muted-foreground">Saldo</p><p className={"font-semibold " + (r.saldo >= 0 ? "text-emerald-700" : "text-rose-700")}>{formatEuro(r.saldo)}</p></div>
            </div>
          </div>
          {(r.einnahmen !== 0 || r.ausgaben !== 0) ? <div className="mt-3 space-y-1">
            <div className="flex items-center gap-2"><span className="w-16 shrink-0 text-[10px] text-muted-foreground">Einnahmen</span><div className="h-2 flex-1 overflow-hidden rounded-full bg-muted"><div className="h-full rounded-full bg-emerald-500" style={{ width: (r.einnahmen / max) * 100 + "%" }} /></div></div>
            <div className="flex items-center gap-2"><span className="w-16 shrink-0 text-[10px] text-muted-foreground">Ausgaben</span><div className="h-2 flex-1 overflow-hidden rounded-full bg-muted"><div className="h-full rounded-full bg-rose-500" style={{ width: (r.ausgaben / max) * 100 + "%" }} /></div></div>
          </div> : null}
        </button>;
      }

      function Dashboard({ wohnungen, onOpen }) {
        const [transaktionen, setTransaktionen] = useState([]);
        const jahr = new Date().getFullYear();
        useEffect(() => { bankService.getTransaktionen().then(setTransaktionen); }, []);
        const zeilen = useMemo(() => wohnungen.map((w) => ({ w, frist: berechneFrist(w.kaufdatum) })).sort((a, b) => (a.frist.ende ? a.frist.ende.getTime() : Infinity) - (b.frist.ende ? b.frist.ende.getTime() : Infinity)), [wohnungen]);
        const kauf = wohnungen.reduce((s, w) => s + (w.kaufpreis || 0), 0);
        const kalt = wohnungen.reduce((s, w) => s + (w.miete.kaltmiete || 0), 0);
        const badge = { gruen: ["success"], gelb: ["warning"], rot: ["danger"], unbekannt: ["secondary"] };
        const bar = { gruen: "bg-emerald-500", gelb: "bg-amber-500", rot: "bg-rose-500", unbekannt: "bg-slate-300" };
        const Stat = ({ label, value }) => <Card><CardContent className="p-5"><p className="text-sm text-muted-foreground">{label}</p><p className="mt-2 text-2xl font-semibold tracking-tight">{value}</p></CardContent></Card>;
        return <div className="space-y-6">
          <header><h1 className="text-2xl font-semibold tracking-tight">Dashboard</h1><p className="mt-1 text-sm text-muted-foreground">Übersicht aller Objekte und der 10-Jahres-Fristen.</p></header>
          <div className="grid gap-4 sm:grid-cols-3"><Stat label="Wohnungen" value={String(wohnungen.length)} /><Stat label="Kaufpreise gesamt" value={formatEuro(kauf)} /><Stat label="Kaltmiete / Monat" value={formatEuro(kalt)} /></div>
          <Card>
            <CardHeader><CardTitle>🗓️ Zeitstrahl – 10-Jahres-Frist (Spekulationsfrist)</CardTitle></CardHeader>
            <CardContent className="space-y-4">
              {zeilen.length === 0 ? <p className="text-sm text-muted-foreground">Noch keine Wohnung angelegt.</p> : null}
              {zeilen.map(({ w, frist }) => <button key={w.id} onClick={() => onOpen(w.id)} className="block w-full rounded-lg border border-border p-4 text-left transition-colors hover:bg-accent/50">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div><p className="font-medium">{w.bezeichnung || "Ohne Namen"}</p><p className="text-xs text-muted-foreground">{w.ort || "–"} · Kauf: {formatDate(w.kaufdatum)}</p></div>
                  <div className="text-right"><Badge variant={badge[frist.status][0]}>{frist.labelVerbleibend}</Badge><p className="mt-1 text-xs text-muted-foreground">Frist: {frist.ende ? formatDate(frist.ende.toISOString().slice(0, 10)) : "–"}</p></div>
                </div>
                <div className="mt-3 h-2 w-full overflow-hidden rounded-full bg-muted"><div className={cx("h-full rounded-full", bar[frist.status])} style={{ width: frist.fortschritt + "%" }} /></div>
              </button>)}
            </CardContent>
          </Card>
          <Card>
            <CardHeader><CardTitle>💶 Finanzstatus je Wohnung ({jahr})</CardTitle></CardHeader>
            <CardContent className="space-y-3">
              {wohnungen.length === 0 ? <p className="text-sm text-muted-foreground">Noch keine Wohnung angelegt.</p> : null}
              {transaktionen.length === 0 && wohnungen.length > 0 ? <p className="rounded-md bg-amber-50 p-3 text-xs text-amber-800">Noch keine Kontobewegungen. Im Reiter „Mieteingang" einer Wohnung lassen sich Demodaten laden oder Umsätze importieren.</p> : null}
              {wohnungen.map((w) => <FinanzZeile key={w.id} w={w} transaktionen={transaktionen} jahr={jahr} onOpen={onOpen} />)}
            </CardContent>
          </Card>
          <p className="rounded-md bg-muted p-3 text-xs text-muted-foreground">ℹ️ Keine Steuerberatung – bitte steuerliche Fragen mit einem Fachberater klären. Die 10-Jahres-Frist bezieht sich auf § 23 EStG (privater Veräußerungsgewinn).</p>
        </div>;
      }

      function WohnungenList({ wohnungen, reload, onOpen }) {
        const [suche, setSuche] = useState("");
        const [neuOffen, setNeuOffen] = useState(false), [neuName, setNeuName] = useState("");
        const [loesch, setLoesch] = useState(null);
        const gefiltert = useMemo(() => {
          const q = suche.trim().toLowerCase();
          return !q ? wohnungen : wohnungen.filter((w) => [w.bezeichnung, w.strasse, w.plz, w.ort, w.mieter.name].join(" ").toLowerCase().includes(q));
        }, [wohnungen, suche]);
        const varr = { gruen: "success", gelb: "warning", rot: "danger", unbekannt: "secondary" };
        async function anlegen() { const w = leereWohnung(); w.bezeichnung = neuName.trim() || "Neue Wohnung"; await repo.saveWohnung(w); setNeuOffen(false); setNeuName(""); await reload(); onOpen(w.id); }
        return <div className="space-y-6">
          <header className="flex flex-wrap items-center justify-between gap-3">
            <div><h1 className="text-2xl font-semibold tracking-tight">Wohnungen</h1><p className="mt-1 text-sm text-muted-foreground">Alle Mietobjekte verwalten.</p></div>
            <Button onClick={() => setNeuOffen(true)}>➕ Wohnung anlegen</Button>
          </header>
          <div className="relative max-w-md"><span className="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground">🔍</span><Input value={suche} onChange={(e) => setSuche(e.target.value)} placeholder="Suchen nach Name, Ort, Mieter …" className="pl-9" /></div>
          {gefiltert.length === 0 ? (
            <Card><CardContent className="flex flex-col items-center gap-3 py-12 text-center">
              <div className="text-4xl">🏢</div>
              <div><p className="font-medium">{suche ? "Keine Treffer" : "Noch keine Wohnung angelegt"}</p><p className="text-sm text-muted-foreground">{suche ? "Passe die Suche an." : "Lege deine erste Wohnung an, um zu starten."}</p></div>
              {!suche ? <Button onClick={() => setNeuOffen(true)}>➕ Wohnung anlegen</Button> : null}
            </CardContent></Card>
          ) : (
            <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
              {gefiltert.map((w) => { const frist = berechneFrist(w.kaufdatum); return (
                <Card key={w.id} className="group cursor-pointer transition-shadow hover:shadow-md" onClick={() => onOpen(w.id)}><CardContent className="space-y-3 p-5">
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0"><p className="truncate font-medium">{w.bezeichnung || "Ohne Namen"}</p><p className="mt-0.5 text-xs text-muted-foreground">📍 {[w.plz, w.ort].filter(Boolean).join(" ") || "Keine Adresse"}</p></div>
                    <Badge variant={varr[frist.status]}>{frist.status === "gruen" ? "frei" : frist.labelVerbleibend}</Badge>
                  </div>
                  <div className="grid grid-cols-2 gap-2 text-sm">
                    <div><p className="text-xs text-muted-foreground">Wohnfläche</p><p>{w.wohnflaeche ? w.wohnflaeche + " m²" : "–"}</p></div>
                    <div><p className="text-xs text-muted-foreground">Kaltmiete</p><p>{formatEuro(w.miete.kaltmiete)}</p></div>
                  </div>
                  <div className="flex items-center justify-between border-t border-border pt-3">
                    <p className="truncate text-xs text-muted-foreground">Mieter: {w.mieter.name || "–"}</p>
                    <Button variant="ghost" size="icon" className="text-muted-foreground hover:text-destructive" onClick={(e) => { e.stopPropagation(); setLoesch(w); }}>🗑️</Button>
                  </div>
                </CardContent></Card>
              ); })}
            </div>
          )}
          <Dialog open={neuOffen} onClose={() => setNeuOffen(false)} title="Neue Wohnung anlegen" description="Vergib einen Namen. Alle weiteren Daten erfasst du danach in den Reitern."
            footer={<><Button variant="outline" onClick={() => setNeuOffen(false)}>Abbrechen</Button><Button onClick={anlegen}>Anlegen</Button></>}>
            <Field label="Bezeichnung"><Input value={neuName} autoFocus onChange={(e) => setNeuName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && anlegen()} placeholder="z. B. Altbau Schwabing" /></Field>
          </Dialog>
          <Dialog open={!!loesch} onClose={() => setLoesch(null)} title="Wohnung löschen?" description={loesch ? `„${loesch.bezeichnung}" und alle zugehörigen Dokumente werden dauerhaft entfernt.` : ""}
            footer={<><Button variant="outline" onClick={() => setLoesch(null)}>Abbrechen</Button><Button variant="destructive" onClick={async () => { await repo.deleteWohnung(loesch.id); setLoesch(null); reload(); }}>🗑️ Endgültig löschen</Button></>} />
        </div>;
      }

      function App() {
        const [view, setView] = useState({ name: "dashboard" });
        const [wohnungen, setWohnungen] = useState(null);
        const reload = useCallback(async () => setWohnungen(await repo.getWohnungen()), []);
        useEffect(() => { reload(); }, [reload]);

        const nav = (name) => setView({ name });
        const open = (id) => setView({ name: "detail", id });

        const NavBtn = ({ name, icon, label }) => <button onClick={() => nav(name)} className={cx("flex items-center gap-3 rounded-md px-3 py-2 text-sm font-medium transition-colors", (view.name === name || (name === "wohnungen" && view.name === "detail")) ? "bg-primary text-primary-foreground" : "text-muted-foreground hover:bg-accent hover:text-foreground")}><span>{icon}</span>{label}</button>;

        return <div className="flex min-h-screen flex-col md:flex-row">
          <aside className="no-print hidden w-60 shrink-0 border-r border-border bg-card md:flex md:flex-col">
            <div className="flex items-center gap-2 px-6 py-5"><div className="flex h-9 w-9 items-center justify-center rounded-lg bg-primary text-lg text-primary-foreground">🏢</div><div><p className="text-sm font-semibold leading-tight">Wohnungs­verwaltung</p><p className="text-xs text-muted-foreground">HTML-Tester</p></div></div>
            <nav className="flex-1 space-y-1 px-3"><NavBtn name="dashboard" icon="📊" label="Dashboard" /><NavBtn name="wohnungen" icon="🏢" label="Wohnungen" /></nav>
            <p className="px-6 py-4 text-xs text-muted-foreground">Lokale Speicherung · IndexedDB</p>
          </aside>
          <main className="flex-1 pb-20 md:pb-0"><div className="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
            {wohnungen == null ? <p className="text-sm text-muted-foreground">Lädt …</p>
              : view.name === "dashboard" ? <Dashboard wohnungen={wohnungen} onOpen={open} />
              : view.name === "wohnungen" ? <WohnungenList wohnungen={wohnungen} reload={reload} onOpen={open} />
              : <WohnungDetail id={view.id} onBack={async () => { await reload(); nav("wohnungen"); }} />}
          </div></main>
          <nav className="no-print fixed inset-x-0 bottom-0 z-40 flex border-t border-border bg-card md:hidden">
            <button onClick={() => nav("dashboard")} className={cx("flex flex-1 flex-col items-center gap-1 py-2.5 text-xs font-medium", view.name === "dashboard" ? "text-primary" : "text-muted-foreground")}><span>📊</span>Dashboard</button>
            <button onClick={() => nav("wohnungen")} className={cx("flex flex-1 flex-col items-center gap-1 py-2.5 text-xs font-medium", view.name !== "dashboard" ? "text-primary" : "text-muted-foreground")}><span>🏢</span>Wohnungen</button>
          </nav>
        </div>;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
